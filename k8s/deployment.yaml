apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotseek-website
  namespace: qthe
  labels:
    app: dotseek-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotseek-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dotseek-website
    spec:
      containers:
        - name: dotseek-website
          image: REGISTRY_PLACEHOLDER/dotseek-website:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
